name: 생활인구 수집

on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준입니다. 2시간마다 돌려서 한 번 실패해도 다음 실행이 자동으로 메웁니다.
    # 이미 받은 날짜는 건너뛰므로 대부분의 실행은 API를 몇 번만 호출하고 끝납니다.
    - cron: '17 */2 * * *'  # 한국 시간 홀수 시 17분 (01:17, 03:17, ... 23:17)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 데이터 수집
        run: node scripts/collect.mjs
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%F) 수집"
            git push
          fi
